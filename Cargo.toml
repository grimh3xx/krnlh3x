[package]
name = "krnlh3x"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["grimh3xx"]
description = "krnlh3x — read-only kernel hardening auditor for Linux and Windows (KSPP sysctl/config, lockdown, CPU mitigations, HVCI/VBS/CI)"
repository = "https://github.com/grimh3xx/krnlh3x"
license = "MIT"
keywords = ["security", "kernel", "hardening", "hvci", "blue-team"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = { version = "4", features = ["supports-colors"] }
anstream = "0.6"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
